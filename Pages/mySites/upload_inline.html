<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload Test</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 60px auto; }
  form { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
  input[type="submit"] { margin-top: 10px; padding: 6px 16px; }
  #result { margin-top: 20px; }
  #result h3 { margin-bottom: 4px; }
  pre {
    background: #f5f5f5;
    border: 1px solid #ddd;
    padding: 12px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 400px;
    overflow-y: auto;
  }
  .status-ok { color: green; }
  .status-err { color: #b00; }
</style>
</head>
<body>
  <h2>Upload a file</h2>
  <form id="uploadForm">
    <input type="file" name="file" id="fileInput" required>
    <br>
    <input type="submit" value="Upload">
  </form>

  <div id="result" style="display:none;">
    <h3>Response <span id="statusLine"></span></h3>
    <strong>Headers:</strong>
    <pre id="headers"></pre>
    <strong>Body:</strong>
    <pre id="body"></pre>
  </div>

<script>
const form = document.getElementById('uploadForm');
const resultDiv = document.getElementById('result');
const statusLine = document.getElementById('statusLine');
const headersEl = document.getElementById('headers');
const bodyEl = document.getElementById('body');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files.length) return;

  const formData = new FormData();
  formData.append('file', fileInput.files[0]);

  resultDiv.style.display = 'block';
  statusLine.textContent = '';
  statusLine.className = '';
  headersEl.textContent = '';
  bodyEl.textContent = 'Uploading...';

  try {
    const res = await fetch('/upload', {
      method: 'POST',
      body: formData
    });

    const text = await res.text();

    statusLine.textContent = `${res.status} ${res.statusText}`;
    statusLine.className = res.ok ? 'status-ok' : 'status-err';

    let headerStr = '';
    for (const [key, value] of res.headers.entries()) {
      headerStr += `${key}: ${value}\n`;
    }
    headersEl.textContent = headerStr || '(no headers exposed)';

    bodyEl.textContent = text || '(empty body)';
  } catch (err) {
    statusLine.textContent = 'Request failed';
    statusLine.className = 'status-err';
    bodyEl.textContent = err.message;
  }
});
</script>
</body>
</html>
