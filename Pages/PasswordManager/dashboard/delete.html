<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 320px;
      width: 100%;
    }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #e8f0fe;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 500; color: #1a56db;
      flex-shrink: 0;
    }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
    .name { font-size: 15px; font-weight: 500; color: #111; }
    .sub { font-size: 13px; color: #666; }
    .rows { border-top: 1px solid #e0e0e0; padding-top: 1rem; display: grid; gap: 10px; }
    .row { display: flex; justify-content: space-between; font-size: 13px; }
    .row span:first-child { color: #666; }
    .row span:last-child { font-weight: 500; color: #111; }
    .active { color: #1a7f37 !important; }
    .footer { border-top: 1px solid #e0e0e0; margin-top: 1rem; padding-top: 1rem; }
    .footer a { font-size: 13px; color: #666; text-decoration: none; }
    .footer a:hover { color: #111; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="avatar">E</div>
      <div>
        <p class="name">Welcome back, Eric.</p>
        <p class="sub">Successfully authenticated.</p>
      </div>
    </div>
    <div class="rows">
      <div class="row"><span>Status</span><span class="active">Active</span></div>
      <div class="row"><span>Session</span><span>Secure</span></div>
      <div class="row"><span>Passwords stored</span><span>—</span></div>
    </div>
    <div class="footer">
      <a href="/login/">Log out</a>
    </div>
  </div>
</body>
</html>
