<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 320px;
      width: 100%;
    }
    h1 { font-size: 1.1rem; font-weight: 500; color: #111; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.85rem; color: #666; margin-bottom: 1.5rem; }
    .field { display: grid; gap: 4px; margin-bottom: 12px; }
    label { font-size: 12px; color: #666; }
    input {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus { border-color: #aaa; }
    button {
      width: 100%;
      padding: 0.65rem;
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #333; }
    .footer-link {
      text-align: center;
      font-size: 0.82rem;
      color: #666;
      margin-top: 1.25rem;
    }
    .footer-link a {
      color: #111;
      font-weight: 500;
      text-decoration: none;
    }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Anmelden</h1>
    <p class="subtitle">Bitte melde dich mit deinen Zugangsdaten an.</p>
    <form action="login.py" method="POST">
      <div class="field">
        <label for="email">E-Mail</label>
        <input type="email" id="email" name="email" placeholder="alice@example.com" />
      </div>
      <div class="field">
        <label for="password">Passwort</label>
        <input type="password" id="password" name="password" placeholder="••••••••" />
      </div>
      <button type="submit">Anmelden</button>
    </form>
    <p class="footer-link">Noch kein Konto? <a href="/registration/">Registrieren</a></p>
  </div>
</body>
</html>
